tests:
  - id: answers-simple-prompt-with-local-model
    kind: mcp
    target:
      exposed_path: /mcp
    request:
      tool: ask_local_model
      inputs:
        prompt: "Reply with a short confirmation that the local llama.cpp model is running."
    verbose_output:
      - $.model
      - $.content
    validations:
      - $.model.exists()
      - $.content.exists()
