tests:
  - id: simple-local-chat
    test: answers a simple prompt with the local model
    exposed_path: /mcp
    tool: ask_local_model
    inputs:
      prompt: "Reply with a short confirmation that the local llama.cpp model is running."
    verboseOutput:
      - $.model
      - $.content
    validations:
      - $.model.exists()
      - $.content.exists()
